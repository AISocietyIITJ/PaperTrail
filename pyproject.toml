[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrail"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "black>=26.5.1",
    "hydra-core>=1.3.4",
    "omegaconf>=2.3.1",
    "optuna>=4.9.0",
    "torch>=2.12.1",
    "torchinfo>=1.8.0",
    "torchvision>=0.27.1",
    "wandb>=0.28.0",
]

[project.scripts]
papertrail-train = "mnist_task.train:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
