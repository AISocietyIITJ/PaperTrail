[project]
name = "papertrail"
version = "0.1.0"
description = "Research paper navigation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx",
    "numpy",
    "pandas",
    "PyYAML",
    "scikit-learn",
    "torch",
    "sentence-transformers",
    "pyarrow>=25.0.0",
    "faiss-cpu>=1.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
