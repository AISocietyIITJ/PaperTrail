defaults:
  - dataset: mnist
  - override hydra/sweeper: optuna
  - _self_

lr: 0.001
epochs: 10
batch_size: 64

hydra:
  sweeper:
    direction: maximize
    n_trials: 10
    n_jobs: 1
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
    params:
      lr: tag(log, interval(1e-4, 1e-2))
      batch_size: choice(64, 128, 256)
